<title>Flappy Diver</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&display=swap">
<style>
  /* Layout: one full-screen canvas, game world scaled to fit; single deep-sea look on purpose */
  :root {
    --bg: #062a4a;
    --water: #0b4a7a;
    --foam: #9be7ff;
    --ink: #f4fbff;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #game:focus-visible { outline: 3px solid var(--foam); outline-offset: -3px; }

  /* Buoyancy switch, shown on the start screen only */
  #buoyancy {
    position: fixed;
    left: 50%;
    top: 83%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: var(--display);
  }
  #buoyancy .label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-shadow: 0 2px 0 var(--bg);
  }
  #buoyancy .seg {
    display: flex;
    padding: 4px;
    gap: 4px;
    border-radius: 999px;
    background: var(--bg);
    box-shadow: 0 0 0 2px var(--foam);
  }
  #buoyancy button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    white-space: nowrap;
  }
  #buoyancy button[aria-pressed="true"] { background: var(--foam); color: var(--bg); }
  #buoyancy button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #buoyancy #audit-start {
    font-size: 12px;
    padding: 8px 14px;
    box-shadow: 0 0 0 2px var(--foam);
    background: var(--bg);
  }

  /* AI audit controls, pinned over the sea floor */
  #audit-hud {
    position: fixed;
    left: 50%;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: var(--display);
    width: max-content;
    max-width: calc(100% - 32px);
  }
  #audit-stats {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--bg);
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .audit-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #audit-hud button, #audit-log button {
    font: inherit;
    font-size: 12px;
    color: var(--ink);
    background: var(--bg);
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    box-shadow: 0 0 0 2px var(--foam);
    cursor: pointer;
  }
  #audit-hud button:focus-visible, #audit-log button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #audit-log {
    position: fixed;
    inset: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    border-radius: 14px;
    background: var(--bg);
    box-shadow: 0 0 0 2px var(--foam), 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  #audit-log .head { display: flex; align-items: center; gap: 8px; font-family: var(--display); }
  #audit-log .head strong { flex: 1; font-weight: 400; font-size: 16px; }
  #audit-log-text {
    flex: 1;
    min-height: 0;
    margin: 0;
    overflow: auto;
    white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
</style>

<canvas id="game" tabindex="0" aria-label="Flappy Diver game. Tap, click, or press space to swim."></canvas>
<div id="buoyancy" role="group" aria-label="Buoyancy">
  <span class="label">BUOYANCY</span>
  <div class="seg">
    <button type="button" id="buoy-neg" data-mode="negative">Sink ↓</button>
    <button type="button" id="buoy-pos" data-mode="positive">Float ↑</button>
  </div>
  <button type="button" id="audit-start">Watch AI audit</button>
</div>
<div id="audit-hud" hidden>
  <span id="audit-stats">AI AUDIT</span>
  <div class="audit-row">
    <button type="button" id="audit-speed">Speed 1×</button>
    <button type="button" id="audit-boxes">Hitboxes off</button>
    <button type="button" id="audit-log-btn">Crash log (0)</button>
    <button type="button" id="audit-stop">Stop</button>
  </div>
</div>
<div id="audit-log" hidden role="dialog" aria-label="Crash log">
  <div class="head">
    <strong>Crash log</strong>
    <button type="button" id="audit-copy">Copy</button>
    <button type="button" id="audit-close">Close</button>
  </div>
  <pre id="audit-log-text">No crashes yet.</pre>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  // Older phones lack roundRect; fall back to a plain rectangle
  if (!ctx.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

  // Game world size (logical units). It is scaled to fill the screen height.
  const H = 640;
  let W = 360, scale = 1;

  const GRAVITY = 1250;   // sinking pull, units per second squared
  const KICK = -430;      // upward speed on tap
  const SPEED = 145;      // scroll speed
  const SPACING = 250;    // normal distance between obstacle columns
  const PX_PER_M = 40;    // world units per meter of distance
  const FLOOR = 80;       // sea floor height
  const DIVER_R = 13;
  const STEP = 1 / 60;    // fixed physics step, so the AI can predict the game exactly

  const HAZARDS = ["jelly", "shark", "puffer", "mine", "barrel"];

  let state, diver, cols, hazards, bubbles, score, dist, calmT, best, floorX, overT, time, bubbleT;

  try { best = Number(localStorage.getItem("flappy-diver-best-m")) || 0; } catch (e) { best = 0; }

  // Buoyancy: "negative" sinks and taps push up; "positive" floats and taps push down.
  let mode = "negative";
  try { if (localStorage.getItem("flappy-diver-buoyancy") === "positive") mode = "positive"; } catch (e) {}
  const dir = () => (mode === "positive" ? -1 : 1);

  const buoyUI = document.getElementById("buoyancy");
  const buoyBtns = buoyUI.querySelectorAll("button");
  function setMode(m) {
    mode = m;
    buoyBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
    try { localStorage.setItem("flappy-diver-buoyancy", m); } catch (e) {}
  }
  buoyBtns.forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  setMode(mode);

  // Fixed background decor, made once
  const motes = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), s: 1 + Math.random() * 2 }));
  const school = Array.from({ length: 7 }, (_, i) => ({ dx: (i % 4) * 16, dy: Math.floor(i / 4) * 12 + (i % 2) * 5 }));

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    // Skip while the page is hidden or collapsed; a zero size would break the world width
    if (!canvas.clientWidth || !canvas.clientHeight) return;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
    scale = canvas.height / H;
    W = canvas.width / scale;
  }

  function reset() {
    state = "ready";
    buoyUI.hidden = audit;
    readyT = time;
    aiPath = [];
    diver ={ x: Math.min(W * 0.3, 120), y: H * 0.42, vy: 0, rot: 0 };
    cols = [];
    hazards = [];
    bubbles = [];
    score = 0;
    dist = 0;
    calmT = -10;
    floorX = 0;
    overT = 0;
    bubbleT = 0;
  }

  /* ---------- Obstacle library ----------
     Each gate has a piece hanging from the surface and a piece rising from the
     sea floor, with a clear opening between them. Every piece has its own size,
     art, and hit shapes. Hit shapes sit inside the art, so what you see is fair.
     Hit shapes: R = rectangle, C = circle, E = ellipse, in piece-local x and world y. */

  const FLOOR_Y = H - FLOOR;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const R = (x, y, w, h) => ({ t: "r", x, y, w, h });
  const C = (x, y, r) => ({ t: "c", x, y, r });
  const E = (x, y, rx, ry) => ({ t: "e", x, y, rx, ry });

  function fillE(x, y, rx, ry, col, rot = 0) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2);
    ctx.fill();
  }
  function fillR(x, y, w, h, col, rad = 0) {
    ctx.fillStyle = col;
    ctx.beginPath();
    if (rad) ctx.roundRect(x, y, w, h, rad); else ctx.rect(x, y, w, h);
    ctx.fill();
  }
  function poly(pts, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
    ctx.fill();
  }
  function line(pts, w, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.stroke();
  }
  function chain(x, y0, y1, col) {
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    for (let y = y0; y < y1 - 4; y += 9) {
      ctx.beginPath();
      ctx.ellipse(x, y + 4, 3, 5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  function spikyBall(x, y, r, body, light) {
    ctx.strokeStyle = "#2a323c";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    for (let k = 0; k < 8; k++) {
      const a = (k * Math.PI) / 4 + 0.2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * (r - 4), y + Math.sin(a) * (r - 4));
      ctx.lineTo(x + Math.cos(a) * (r + 6), y + Math.sin(a) * (r + 6));
      ctx.stroke();
    }
    fillE(x, y, r, r, body);
    fillE(x - r * 0.35, y - r * 0.35, r * 0.25, r * 0.18, "rgba(255,255,255,0.18)");
    fillE(x, y, 4, 4, light);
  }
  function fish(x, y, s, col, flip) {
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1);
    fillE(0, 0, 6 * s, 2.6 * s, col);
    poly([[5 * s, 0], [10 * s, -3 * s], [10 * s, 3 * s]], col);
    ctx.restore();
  }

  /* ----- Pieces rising from the sea floor: region y from FLOOR_Y - h to FLOOR_Y ----- */
  const BOTTOMS = [
    { name: "half-buried pirate ship", minH: 110, build(h) {
      const w = 170, Y = FLOOR_Y, yT = Y - h;
      const hullH = Math.min(80, h * 0.5), hullTop = Y - hullH, mx = 96;
      const room = hullTop - yT;
      const nest = room > 60, sh = Math.min(70, room - 60), sail = sh > 34;
      const prims = [R(12, hullTop + 16, 150, hullH - 16), R(mx - 4, yT + 12, 8, room)];
      if (nest) prims.push(R(mx - 11, yT + 3, 22, 10));
      if (sail) prims.push(R(mx - 26, yT + 38, 48, sh - 20));
      return { name: this.name, w, prims, draw() {
        // Mast, yard, sail, crow's nest, flag
        fillR(mx - 4, yT + 10, 8, room + 10, "#4a321f");
        if (sail) {
          fillR(mx - 34, yT + 30, 68, 5, "#4a321f");
          const s0 = yT + 33, s1 = s0 + sh;
          poly([[mx - 32, s0], [mx + 30, s0], [mx + 27, s1], [mx + 12, s1 - 10], [mx, s1], [mx - 14, s1 - 12], [mx - 30, s1]], "#e8dcc0");
          fillE(mx - 4, s0 + sh * 0.45, 9, 7, "rgba(60,40,20,0.35)");
        }
        if (nest) fillR(mx - 11, yT + 2, 22, 12, "#5a3b22", 2);
        const fy = yT + (nest ? 2 : 10), wave = Math.sin(time * 5) * 2;
        poly([[mx + 4, fy - 2], [mx + 26, fy + wave], [mx + 24, fy + 12 + wave], [mx + 4, fy + 10]], "#1a1a1a");
        fillE(mx + 14, fy + 5 + wave / 2, 3, 3, "#f4f4f4");
        // Tilted hull
        poly([[4, Y], [0, hullTop + 6], [14, hullTop], [40, hullTop + 8], [150, hullTop + 12], [170, hullTop + 2], [166, Y]], "#5a3b22");
        line([[6, hullTop + 14], [166, hullTop + 18]], 3, "#c9a227");
        ctx.strokeStyle = "#3e2915";
        ctx.lineWidth = 2;
        for (let yy = hullTop + 28; yy < Y; yy += 13) { ctx.beginPath(); ctx.moveTo(4, yy); ctx.lineTo(166, yy + 3); ctx.stroke(); }
        for (let x = 24; x < 160; x += 30) fillR(x, hullTop + 22, 12, 8, "#1b120a", 2);
        poly([[110, hullTop + 30], [130, hullTop + 26], [138, hullTop + 44], [118, hullTop + 50]], "#1b120a");
        fillE(30, hullTop + 18, 8, 5, "#4f8a4a");
        fillE(85, Y + 6, 95, 20, "#d9bf86");
      } };
    } },
    { name: "tethered mine", minH: 64, build(h) {
      const w = 54, Y = FLOOR_Y, yT = Y - h, cx = 27, by = yT + 26;
      return { name: this.name, w, prims: [C(cx, by, 14), R(cx - 2, by + 16, 4, Y - by - 28), R(cx - 14, Y - 12, 28, 12)], draw() {
        chain(cx, by + 14, Y - 12, "#7a7f86");
        fillR(cx - 16, Y - 14, 32, 14, "#6b6f75", 3);
        spikyBall(cx, by, 17, "#3b4550", Math.sin(time * 6) > 0 ? "#ff3b3b" : "#7a1d1d");
      } };
    } },
    { name: "seaweed patch", minH: 40, build(h) {
      const w = 104, Y = FLOOR_Y, n = 6, tall = Math.floor(Math.random() * n);
      const cols = ["#3f9d4f", "#5bb85a", "#2e7d3f", "#b0413e", "#4caf6a", "#3f9d4f"];
      const strands = Array.from({ length: n }, (_, i) => ({
        x: 12 + i * 16,
        h: i === tall ? h : Math.max(30, rnd(0.45, 0.95) * h),
        col: cols[(i + Math.floor(Math.random() * 6)) % 6],
        ph: Math.random() * 6,
      }));
      return { name: this.name, w, prims: strands.map(s => R(s.x - 3, Y - s.h + 6, 6, s.h - 6)), draw() {
        for (const s of strands) {
          const pts = [];
          for (let y = 0; y <= s.h; y += 8) {
            const f = y / s.h;
            pts.push([s.x + Math.sin(time * 1.6 + s.ph + y * 0.05) * 2 * f, Y - y]);
          }
          line(pts, 9, s.col);
          for (let y = 16; y < s.h - 6; y += 18) {
            const f = y / s.h, sx = s.x + Math.sin(time * 1.6 + s.ph + y * 0.05) * 2 * f;
            fillE(sx + ((y / 18) % 2 ? 7 : -7), Y - y, 6, 3, s.col, (y / 18) % 2 ? -0.5 : 0.5);
          }
        }
      } };
    } },
    { name: "coral reef", minH: 50, build(h) {
      const w = 100, Y = FLOOR_Y, yT = Y - h;
      const baseH = Math.max(0, h - rnd(80, 120)), top0 = Y - baseH, ch = h - baseH;
      const palette = ["#ff7f6e", "#ffb26b", "#d65a8a", "#b069c9", "#ff5d8f"];
      const main = Math.floor(Math.random() * 3);
      const cl = [22, 50, 78].map((x, i) => {
        const hc = i === main ? ch : rnd(0.5, 0.85) * ch;
        return { x, t: top0 - hc, col: palette[Math.floor(Math.random() * palette.length)] };
      });
      const prims = [];
      if (baseH > 8) prims.push(R(20, top0 + 8, 58, baseH - 8));
      for (const c of cl) prims.push(R(c.x - 7, c.t + 10, 14, top0 - c.t - 6), C(c.x, c.t + 10, 8));
      return { name: this.name, w, prims, draw() {
        if (baseH > 8) poly([[8, Y], [12, top0 + 10], [26, top0], [70, top0 + 2], [90, top0 + 12], [94, Y]], "#4d5d70");
        for (const c of cl) {
          const sway = Math.sin(time * 1.3 + c.x) * 1.5;
          line([[c.x, top0 + 4], [c.x + sway, c.t + 10]], 18, c.col);
          const len = top0 - c.t;
          for (let k = 1; k <= 2; k++) {
            const yy = c.t + len * (0.3 + k * 0.22), side = k % 2 ? 1 : -1;
            if (len > 50) line([[c.x, yy], [c.x + side * 15 + sway, yy - 16]], 9, c.col);
          }
          ctx.fillStyle = "rgba(255,240,230,0.7)";
          for (let yy = c.t + 16; yy < top0; yy += 14) ctx.fillRect(c.x - 2 + ((yy * 7) % 5) - 2, yy, 3, 3);
        }
      } };
    } },
    { name: "boulder pile", minH: 40, build(h) {
      const w = 110, Y = FLOOR_Y, yT = Y - h;
      const n = Math.max(1, Math.round(h / 52)), seg = (h + 8) / n;
      const rocks = [];
      let cx = w / 2;
      for (let i = 0; i < n; i++) {
        let r = clamp(seg * 0.62 + rnd(-3, 3), 16, 50);
        const cy = Y + 8 - seg * (i + 0.5);
        if (i === n - 1) r = Math.min(r, cy - yT);
        cx = clamp(cx + rnd(-18, 18), r + 2, w - r - 2);
        rocks.push({ x: cx, y: cy, r, tone: ["#56677a", "#46566a", "#61748a"][i % 3] });
      }
      const star = rocks[Math.floor(Math.random() * rocks.length)];
      return { name: this.name, w, prims: rocks.map(k => C(k.x, k.y, k.r - 3)), draw() {
        for (const k of rocks) {
          fillE(k.x, k.y, k.r, k.r * 0.95, k.tone);
          fillE(k.x - k.r * 0.3, k.y - k.r * 0.4, k.r * 0.35, k.r * 0.15, "rgba(255,255,255,0.12)");
          fillE(k.x + k.r * 0.4, k.y + k.r * 0.3, 3, 3, "#c8d0d8");
        }
        ctx.fillStyle = "#ff9a3c";
        ctx.beginPath();
        for (let q = 0; q < 10; q++) {
          const a = -Math.PI / 2 + (q * Math.PI) / 5, rr = q % 2 ? 4 : 10;
          ctx.lineTo(star.x + Math.cos(a) * rr, star.y + Math.sin(a) * rr);
        }
        ctx.fill();
        const top = rocks[rocks.length - 1];
        for (let q = -2; q <= 2; q++) line([[top.x + q * 4, top.y - top.r * 0.8], [top.x + q * 6 + Math.sin(time * 3 + q) * 2, top.y - top.r * 0.8 - 10]], 3, "#ff8fc7");
      } };
    } },
    { name: "giant clam", minH: 76, build(h) {
      const w = 110, Y = FLOOR_Y, yT = Y - h;
      return { name: this.name, w, prims: [E(55, yT + 30, 44, 20), R(32, yT + 50, 48, h - 50)], draw() {
        poly([[18, Y], [22, yT + 60], [34, yT + 44], [76, yT + 44], [90, yT + 58], [94, Y]], "#4d5d70");
        const open = 6 + Math.sin(time * 1.2) * 4;
        fillE(55, yT + 30, 46, 20, "#2ec4b6");
        fillE(55, yT + 30 - open * 0.3, 6, 6, "#fdf6e3");
        ctx.fillStyle = "#8a7bc4";
        ctx.beginPath();
        ctx.ellipse(55, yT + 32, 50, 22, 0, 0, Math.PI);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(55, yT + 30 - open, 50, 22, 0, Math.PI, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#6a5aa8";
        ctx.lineWidth = 2;
        for (let q = -3; q <= 3; q++) {
          ctx.beginPath(); ctx.moveTo(55, yT + 32); ctx.lineTo(55 + q * 14, yT + 52); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(55, yT + 30 - open); ctx.lineTo(55 + q * 14, yT + 10 - open); ctx.stroke();
        }
      } };
    } },
    { name: "shipwreck hull", minH: 30, build(h) {
      const w = Math.round(rnd(80, 112)), Y = FLOOR_Y, yT = Y - h;
      const jag = [[-4, yT + 10], [w * 0.2, yT], [w * 0.38, yT + 14], [w * 0.6, yT + 2], [w * 0.8, yT + 12], [w + 4, yT + 4]];
      return { name: this.name, w, prims: [R(0, yT + 14, w, h - 14)], draw() {
        poly([[-4, Y], ...jag, [w + 4, Y]], "#6b4a2f");
        ctx.strokeStyle = "#4a321f";
        ctx.lineWidth = 2;
        for (let yy = yT + 20; yy < Y; yy += 14) { ctx.beginPath(); ctx.moveTo(-4, yy); ctx.lineTo(w + 4, yy); ctx.stroke(); }
        fillR(w - 10, yT + 14, 14, h - 14, "rgba(0,0,0,0.25)");
        for (let py = yT + 44; py < Y - 14; py += 60) { fillE(w / 2, py, 10, 10, "#c9a227"); fillE(w / 2, py, 6, 6, "#0b2236"); }
        fillE(10, yT + 14, 6, 5, "#4f8a4a");
        fillE(w * 0.6, yT + 8, 5, 4, "#4f8a4a");
      } };
    } },
    { name: "hot vent chimney", minH: 70, build(h) {
      const w = 76, Y = FLOOR_Y, yT = Y - h, cx = 38, tw = 26, bw = 72;
      const wid = y => tw + ((bw - tw) * (y - yT)) / h;
      const prims = [];
      const seg = (h - 6) / 4;
      for (let k = 0; k < 4; k++) { const y0 = yT + 6 + k * seg, ww = wid(y0) - 4; prims.push(R(cx - ww / 2, y0, ww, seg + 1)); }

          const t = (time * 0.8 + q / 4) % 1;

      } };
    } },
    { name: "octopus rock", minH: 100, build(h) {
      const w = 120, Y = FLOOR_Y, yT = Y - h, rt = yT + 46;
      return { name: this.name, w, prims: [R(18, rt + 10, 86, Y - rt - 10), E(60, yT + 22, 19, 19), R(30, yT + 38, 60, 10)], draw() {

        for (let q = 0; q < 6; q++) {

        fillE(53, yT + 23, 2.5, 3, "#1b1b1b"); fillE(69, yT + 23, 2.5, 3, "#1b1b1b");
        fillE(56, yT + 8, 3, 2, "#f5a08a"); fillE(66, yT + 12, 2, 2, "#f5a08a");

  /* ----- Pieces hanging from the surface: region y from 0 to h ----- */
  const TOPS = [
    { name: "rock ledge", minH: 30, build(h) {
      const w = Math.round(rnd(70, 112)), B = h;
      const deco = Math.floor(Math.random() * 3);
      return { name: this.name, w, prims: [R(0, 0, w, B - 22)], draw() {

        fillR(w - 14, 0, 18, Math.max(0, B - 24), "#24364a");

        if (deco === 0) for (let i = 0; i < 3; i++) { const fx = 12 + i * (w - 24) / 2; line([[fx, B - 30], [fx - 5, B - 18]], 3, "#ff8fa3"); line([[fx, B - 30], [fx + 5, B - 16]], 3, "#ff8fa3"); }
        if (deco === 1) for (let i = 0; i < 2; i++) { const kx = 16 + i * (w - 32); line([[kx, B - 26], [kx + Math.sin(time * 2 + i) * 4, B - 16], [kx + 2, B - 8]], 5, "#3f9d4f"); }
        if (deco === 2) for (let i = 0; i < 5; i++) fillE(10 + i * (w - 20) / 4, B - 26 - (i % 2) * 8, 4, 3, "#c8d0d8");
      } };
    } },
    { name: "fishing boat net", minH: 120, build(h) {
      const w = 140, B = h;
      return { name: this.name, w, prims: [R(10, 0, 120, 26), R(46, 50, 48, B - 84), R(60, B - 34, 20, 26)], draw() {

        line([[110, 28], [100, 48]], 2, "#d8cfa8");
        const bag = [[36, 46], [104, 46], [98, B - 30], [80, B - 4], [60, B - 4], [42, B - 30]];

        for (let q = 0; q < 5; q++) fish(56 + (q % 3) * 12, B - 20 - q * 14, 1, "#c0d6e4", q % 2);

    { name: "hanging anchor", minH: 90, build(h) {

        poly([[62, B - 26], [50, B - 16], [60, B - 12]], "#5d6670");

    } },
    { name: "submarine", minH: 100, build(h) {
      const w = 186, B = h;
      return { name: this.name, w, prims: [E(90, B - 30, 84, 23), R(73, B - 70, 34, 26), R(93, 0, 4, B - 72)], draw() {
        fillR(92, 0, 6, B - 70, "#9aa3ad");

        for (let q = 0; q < 4; q++) { fillE(36 + q * 30, B - 34, 7, 7, "#7a5c12"); fillE(36 + q * 30, B - 34, 4.5, 4.5, "#9be7ff"); }
        fillR(4, B - 34, 14, 6, "#7a5c12", 3);
      } };
    } },
    { name: "whale", minH: 80, build(h) {

      return { name: this.name, w, prims: [E(92, B - 36, 84, 29), R(168, B - 44, 10, 16)], draw() {
        const f = Math.sin(time * 2.2) * 6;
        poly([[168, B - 50], [186, B - 42 + f], [200, B - 60 + f], [196, B - 36 + f], [200, B - 12 + f], [186, B - 30 + f], [168, B - 22]], "#34507a");
        fillE(92, B - 36, 90, 34, "#3d5a80");

        ctx.restore();
        line([[8, B - 30], [40, B - 26]], 2, "#24384f");

        for (let q = 0; q < 3; q++) {
          const t = (time * 0.6 + q / 3) % 1;
          fillE(60 + Math.sin(t * 8) * 3, B - 70 - t * 40, 2 + t * 3, 2 + t * 3, `rgba(220,248,255,${0.6 * (1 - t)})`);
        }
      } };
    } },
    { name: "school of fish", minH: 70, build(h) {
      const w = 150, B = h, ry = Math.min(34, (B - 6) / 2), cy = B - ry - 4, rx = 72;
      const school = Array.from({ length: 44 }, () => ({ a: Math.random() * 6.28, f: Math.sqrt(Math.random()) * 0.92, s: rnd(0.8, 1.2) }));
      const col = ["#c0d6e4", "#9ec5dc", "#e2eef5"][Math.floor(Math.random() * 3)];
      return { name: this.name, w, prims: [E(75, cy, rx * 0.8, ry * 0.72)], draw() {
        fillE(75, cy, rx * 0.92, ry * 0.88, "rgba(190, 225, 245, 0.16)");
        for (const p of school) {
          const a = p.a + time * 0.9;
          fish(75 + Math.cos(a) * rx * p.f, cy + Math.sin(a) * ry * p.f, p.s, col, Math.sin(a) > 0);
        }
      } };
    } },
    { name: "sargassum mat", minH: 40, build(h) {
      const w = 110, B = h, n = 6, tall = Math.floor(Math.random() * n);
      const strands = Array.from({ length: n }, (_, i) => ({ x: 10 + i * 18, h: i === tall ? B : Math.max(24, rnd(0.4, 0.9) * B), ph: Math.random() * 6 }));
      return { name: this.name, w, prims: [R(0, 0, w, 12), ...strands.map(s => R(s.x - 3, 0, 6, s.h - 6))], draw() {
        for (const s of strands) {
          const pts = [];
          for (let y = 0; y <= s.h; y += 8) pts.push([s.x + Math.sin(time * 1.4 + s.ph + y * 0.05) * 2 * (y / s.h), y]);
          line(pts, 8, "#a8862f");
          for (let y = 14; y < s.h - 6; y += 16) fillE(s.x + ((y / 16) % 2 ? 6 : -6), y, 3, 3, "#d4b04c");
        }
        for (let x = 0; x <= w; x += 14) fillE(x, 6, 12, 10, x % 28 ? "#b8963a" : "#a8862f");
      } };
    } },
    { name: "buoy mine", minH: 70, build(h) {
      const w = 54, B = h, cx = 27, by = B - 26;
      return { name: this.name, w, prims: [R(cx - 2, 0, 4, by - 14), C(cx, by, 14)], draw() {
        chain(cx, 0, by - 14, "#7a7f86");
        spikyBall(cx, by, 17, "#4a3b50", Math.sin(time * 6 + 1) > 0 ? "#ffd23f" : "#7a5c12");
      } };
    } },
  ];

  function pickPiece(list, h) {
    const ok = list.filter(k => k.minH <= h);
    return ok[Math.floor(Math.random() * ok.length)].build(h);
  }

  // Collision between the diver's circle and one piece's hit shapes
  function hitPrims(prims, ox, cx, y, r) {
    const lx = cx - ox;
    for (const p of prims) {
      if (p.t === "r") {
        const nx = clamp(lx, p.x, p.x + p.w), ny = clamp(y, p.y, p.y + p.h);
        if ((lx - nx) ** 2 + (y - ny) ** 2 < r * r) return true;
      } else if (p.t === "c") {
        if ((lx - p.x) ** 2 + (y - p.y) ** 2 < (p.r + r) ** 2) return true;
      } else {
        const a = p.rx + r, b = p.ry + r;
        if ((lx - p.x) ** 2 / (a * a) + (y - p.y) ** 2 / (b * b) < 1) return true;
      }
    }
    return false;
  }

  function drawPrims(prims, ox) {
    ctx.strokeStyle = "rgba(255, 60, 90, 0.9)";
    ctx.lineWidth = 1.5;
    for (const p of prims) {
      ctx.beginPath();
      if (p.t === "r") ctx.rect(ox + p.x, p.y, p.w, p.h);
      else if (p.t === "c") ctx.arc(ox + p.x, p.y, p.r, 0, Math.PI * 2);
      else ctx.ellipse(ox + p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function addGate(x) {
    const prev = cols[cols.length - 1];
    const gap = rnd(165, 195);
    const minTop = 60, maxTop = FLOOR_Y - 60 - gap;
    let top = rnd(minTop, maxTop);
    if (prev) top = clamp(top, prev.top - 170, prev.top + 170);
    top = clamp(top, minTop, maxTop);
    const bot = top + gap;
    const tp = pickPiece(TOPS, top), bp = pickPiece(BOTTOMS, FLOOR_Y - bot);
    const w = Math.max(tp.w, bp.w);
    const g = { x, w, top, bot, tp, bp, tox: (w - tp.w) / 2, box: (w - bp.w) / 2, passed: false, gap: pickGap(prev) };
    cols.push(g);
    if (!prev) return;
    // Fill the open water between the last gate and this one
    const start = prev.x + prev.w, len = x - start;
    if (prev.gap.type === "wide") {
      const n = len > 440 ? 3 : 2;
      for (let i = 1; i <= n; i++) addHazard(start + (len * i) / (n + 1));
    } else if (prev.gap.type === "normal") {
      if (Math.random() < 0.5 + Math.min(0.4, score * 0.004)) addHazard(start + len / 2);
    }
    // "calm" gaps stay empty for easy swimming
  }

  // Open water after a gate: normal, wide (more creatures), or calm (empty)
  function pickGap(prev) {
    const r = Math.random();
    if (r < 0.12 && !(prev && prev.gap.type === "calm")) return { type: "calm", len: rnd(580, 730) };
    if (r < 0.37) return { type: "wide", len: rnd(390, 550) };
    return { type: "normal", len: 180 };
  }

  function addHazard(x) {
    const type = HAZARDS[Math.floor(Math.random() * HAZARDS.length)];
    const h = { type, x, phase: Math.random() * 6.28, rot: 0 };
    const lo = 90, hi = H - FLOOR - 90;
    h.baseY = lo + Math.random() * (hi - lo);
    if (type === "jelly") { h.rx = 16; h.ry = 18; h.amp = 35; }
    if (type === "shark") { h.rx = 34; h.ry = 11; h.amp = 12; }
    if (type === "puffer") { h.rx = h.ry = 14; h.amp = 18; }
    if (type === "mine") { h.rx = h.ry = 15; h.amp = 20; }
    if (type === "barrel") { h.rx = 13; h.ry = 17; h.amp = 0; h.baseY = 60 + Math.random() * 160; }
    h.y = h.baseY;
    hazards.push(h);
  }

  function puff(n) {
    for (let i = 0; i < n; i++) {
      bubbles.push({
        x: diver.x + 20 + Math.random() * 6,
        y: diver.y - 2 + Math.random() * 6,
        r: 2 + Math.random() * 3,
        vy: -50 - Math.random() * 40,
        w: Math.random() * 6.28,
      });
    }
  }

  function kick() {
    if (state === "ready") {
      state = "play";
      buoyUI.hidden = true;
      addGate(W + 40);
      if (audit) { runs++; runStartT = time; failSnap = null; updateHud(); }
    }
    if (state === "play") {
      diver.vy = KICK * dir();
      puff(3);
    } else if (state === "over" && time - overT > 0.6) {
      reset();
    }
  }

  function die(info) {
    if (state !== "play") return;
    state = "over";
    overT = time;
    lastCause = info;
    puff(8);
    if (audit) { recordCrash(info); return; }
    if (score > best) {
      best = score;
      try { localStorage.setItem("flappy-diver-best-m", String(best)); } catch (e) {}
    }
  }

  // Where a hazard will be k physics steps from now (k = 0 is now)
  function hazardAt(h, k) {
    const T = time + STEP * k;
    const baseY = h.type === "barrel" ? h.baseY + 30 * STEP * k : h.baseY;
    const pr = h.type === "puffer" ? 11 + 6 * (0.5 + 0.5 * Math.sin(T * 2.5 + h.phase)) : 0;
    return {
      x: h.x - SPEED * STEP * k,
      y: baseY + Math.sin(T * 2 + h.phase) * h.amp,
      rx: pr || h.rx,
      ry: pr || h.ry,
    };
  }

  // Does a diver at height y touch anything, k steps from now? The game and the AI both use this.
  function hitTest(y, k, margin) {
    const off = SPEED * STEP * k;
    const r = DIVER_R - 3 + margin, cx = diver.x + 2;
    for (const g of cols) {
      const gx = g.x - off;
      if (cx + r < gx || cx - r > gx + g.w) continue;
      const top = hitPrims(g.tp.prims, gx + g.tox, cx, y, r);
      if (top || hitPrims(g.bp.prims, gx + g.box, cx, y, r)) {
        return { what: "column", name: top ? g.tp.name : g.bp.name, part: top ? "top" : "bottom", dx: Math.round(gx - diver.x), gapTop: Math.round(g.top), gapBottom: Math.round(g.bot) };
      }
    }
    for (const h of hazards) {
      const s = hazardAt(h, k);
      const dx = cx - s.x, dy = y - s.y;
      const a = s.rx + r, b = s.ry + r;
      if ((dx * dx) / (a * a) + (dy * dy) / (b * b) < 1) {
        return { what: "hazard", type: h.type, dx: Math.round(s.x - diver.x), y: Math.round(s.y) };
      }
    }
    return null;
  }

  function update(dt) {
    if (state === "ready") diver.y = H * 0.42 + Math.sin(time * 3) * 10;
    if (state !== "over") floorX = (floorX - SPEED * dt) % 48;

    if (state === "play" || state === "over") {
      diver.vy += GRAVITY * dir() * dt;
      diver.y += diver.vy * dt;
      diver.rot = Math.max(-0.8, Math.min(1.2, diver.vy / 550));
      // Sinkers lose by hitting the sea floor; floaters lose by hitting the surface.
      if (diver.y + DIVER_R >= H - FLOOR) {
        diver.y = H - FLOOR - DIVER_R;
        diver.vy = 0;
        if (mode === "negative") die({ what: "floor" });
      }
      if (diver.y - DIVER_R < 0) {
        diver.y = DIVER_R;
        diver.vy = 0;
        if (mode === "positive") die({ what: "surface" });
      }
    }

    if (state === "play") {
      for (const c of cols) {
        c.x -= SPEED * dt;
        if (!c.passed && c.x + c.w < diver.x) {
          c.passed = true;
          if (c.gap.type === "calm") calmT = time;
        }
      }
      for (const h of hazards) {
        h.x -= SPEED * dt;
        if (h.type === "barrel") { h.baseY += 30 * dt; h.rot += 0.8 * dt; }
        const s = hazardAt(h, 0);
        h.y = s.y;
        h.rx = s.rx;
        h.ry = s.ry;
      }
      const hit = hitTest(diver.y, 0, 0);
      if (hit) die(hit);
    }

    if (state === "play") {
      dist += SPEED * dt;
      score = Math.floor(dist / PX_PER_M);
      // Keep obstacles coming; if the list ever runs dry, start a new one just off-screen
      let last = cols[cols.length - 1];
      if (!last) addGate(W + 40);
      else while (last.x < W + 40) { addGate(last.x + last.w + last.gap.len); last = cols[cols.length - 1]; }
      while (cols.length && cols[0].x + cols[0].w < -40) cols.shift();
      hazards = hazards.filter(h => h.x > -80 && h.baseY < H);

      bubbleT += dt;
      if (bubbleT > 0.45) { bubbleT = 0; puff(1); }
    }

    for (const b of bubbles) {
      b.y += b.vy * dt;
      b.x += Math.sin(time * 4 + b.w) * 12 * dt - (state === "over" ? 0 : SPEED * 0.4 * dt);
    }
    bubbles = bubbles.filter(b => b.y > -10);
  }

  /* ---------- AI audit ---------- */

  // The AI only ever calls kick(), same as a player tap. It plans by simulating
  // the game ahead with hitTest(), trying tap / no-tap at each decision point.
  const DEC = 3;          // physics steps between decisions (0.05 s)
  const HORIZON = 36;     // decisions to look ahead (1.8 s)
  let showBoxes = false;
  let audit = false, auditSpeed = 1, runs = 0, auditBest = 0, runStartT = 0, readyT = 0;
  let aiPath = [], lastPlan = null, failSnap = null, lastCause = null, stepCount = 0;
  const crashes = [];

  function simStep(s, tap, k, margin) {
    let vy = tap ? KICK * dir() : s.vy;
    vy += GRAVITY * dir() * STEP;
    let y = s.y + vy * STEP;
    if (y + DIVER_R + (mode === "negative" ? margin : 0) >= H - FLOOR) {
      if (mode === "negative") return { y, vy, hit: { what: "floor" } };
      y = H - FLOOR - DIVER_R; vy = 0;
    }
    if (y - DIVER_R - (mode === "positive" ? margin : 0) < 0) {
      if (mode === "positive") return { y, vy, hit: { what: "surface" } };
      y = DIVER_R; vy = 0;
    }
    return { y, vy, hit: hitTest(y, k, margin) };
  }

  // Aim for the middle of the next opening; used only to choose which option to try first
  function wantsTap(s, k) {
    const off = SPEED * STEP * k;
    let target = H * 0.45;
    for (const c of cols) {
      if (c.x - off + c.w > diver.x - DIVER_R) { target = (c.top + c.bot) / 2; break; }
    }
    return (s.y + s.vy * 0.15 - target) * dir() > 0;
  }

  function plan(margin, budget) {
    const visited = new Set(), path = [];
    let nodes = 0, bestDepth = 0, bestPath = [];
    function dfs(s, d, k) {
      if (d === HORIZON) return true;
      if (nodes > budget) return false;
      const key = d + "|" + Math.round(s.y / 3) + "|" + Math.round(s.vy / 30);
      if (visited.has(key)) return false;
      visited.add(key);
      const order = wantsTap(s, k) ? [true, false] : [false, true];
      for (const tap of order) {
        let cur = s, ok = true;
        for (let i = 0; i < DEC; i++) {
          nodes++;
          cur = simStep(cur, tap && i === 0, k + i + 1, margin);
          if (cur.hit) { ok = false; break; }
        }
        if (!ok) continue;
        path.push(tap);
        if (path.length > bestDepth) { bestDepth = path.length; bestPath = path.slice(); }
        if (dfs(cur, d + 1, k + DEC)) return true;
        path.pop();
      }
      return false;
    }
    const ok = dfs({ y: diver.y, vy: diver.vy }, 0, 0);
    return {
      ok,
      path: ok ? path.slice() : bestPath,
      seconds: +((ok ? HORIZON : bestDepth) * DEC * STEP).toFixed(2),
      margin,
      exhausted: nodes > budget,
    };
  }

  function aiThink() {
    if (state === "ready") { if (time - readyT > 0.5) kick(); return; }
    if (state === "over") { if (time - overT > 1.4) reset(); return; }
    if (stepCount % DEC !== 0) return;

    // Try with a safety cushion first, then with none
    let p = plan(4, 30000);
    if (!p.ok) {
      const tight = plan(0, 80000);
      if (tight.ok || tight.seconds >= p.seconds) p = tight;
    }
    lastPlan = p;
    if (p.ok) failSnap = null;
    else if (!failSnap) failSnap = { at: time, plan: p, scene: sceneSnapshot() };

    // Trace the plan so it can be drawn
    aiPath = [];
    let s = { y: diver.y, vy: diver.vy };
    for (let i = 0; i < p.path.length * DEC; i++) {
      s = simStep(s, p.path[Math.floor(i / DEC)] && i % DEC === 0, i + 1, 0);
      if (i % 3 === 2) aiPath.push({ x: diver.x + SPEED * STEP * (i + 1), y: s.y });
      if (s.hit) break;
    }

    if (p.path[0]) kick();
  }

  function sceneSnapshot() {
    const x0 = diver.x;
    return {
      run_time_s: +(time - runStartT).toFixed(2),
      distance_m: score,
      diver: { y: Math.round(diver.y), vy: Math.round(diver.vy) },
      columns: cols
        .filter(c => c.x + c.w > x0 - 40 && c.x < x0 + 420)
        .map(c => ({ top: c.tp.name, bottom: c.bp.name, dx: Math.round(c.x - x0), width: Math.round(c.w), gapTop: Math.round(c.top), gapBottom: Math.round(c.bot), gapAfter: c.gap.type })),
      hazards: hazards
        .filter(h => h.x > x0 - 60 && h.x < x0 + 420)
        .map(h => ({ type: h.type, dx: Math.round(h.x - x0), y: Math.round(h.y), swing: h.amp })),
    };
  }

  const HAZARD_NAMES = { jelly: "jellyfish", shark: "shark", puffer: "pufferfish", mine: "sea mine", barrel: "toxic barrel" };
  function causeName(info) {
    if (!info) return "unknown";
    if (info.what === "floor") return "sea floor";
    if (info.what === "surface") return "surface";
    if (info.what === "column") return info.name;
    return HAZARD_NAMES[info.type] || info.type;
  }

  function recordCrash(info) {
    auditBest = Math.max(auditBest, score);
    let verdict;
    if (!failSnap) {
      verdict = "AI error: the plan said this was safe, but the diver crashed. The AI's model of the game is off.";
    } else if (failSnap.plan.exhausted) {
      verdict = `Search ran out of time ${(time - failSnap.at).toFixed(2)} s before the crash. Might be winnable with a deeper search.`;
    } else {
      verdict = `No safe path: ${(time - failSnap.at).toFixed(2)} s before the crash, every tap pattern hit something within ${failSnap.plan.seconds} s. This layout is likely unwinnable.`;
    }
    crashes.push({
      crash: crashes.length + 1,
      run: runs,
      mode: mode === "positive" ? "float" : "sink",
      distance_m: score,
      run_time_s: +(time - runStartT).toFixed(2),
      hit: causeName(info),
      hit_detail: info,
      diver_at_crash: { y: Math.round(diver.y), vy: Math.round(diver.vy) },
      verdict,
      first_trouble: failSnap ? failSnap.scene : null,
      scene_at_crash: sceneSnapshot(),
    });
    updateHud();
    renderLog();
  }

  function crashText(c) {
    const lines = [
      `#${c.crash}  Run ${c.run}  ${c.mode} mode  ${c.distance_m} m  (${c.run_time_s} s)`,
      `Hit: ${c.hit}`,
      `Verdict: ${c.verdict}`,
    ];
    const sc = c.first_trouble || c.scene_at_crash;
    lines.push(c.first_trouble ? `Scene when the AI first found no safe path (${sc.run_time_s} s):` : "Scene at crash:");
    lines.push(`  diver y ${sc.diver.y}, speed ${sc.diver.vy}`);
    for (const col of sc.columns) lines.push(`  ${col.top} over ${col.bottom}, ${col.dx >= 0 ? "+" : ""}${col.dx} ahead, ${col.width} wide, opening y ${col.gapTop}-${col.gapBottom}, then ${col.gapAfter} gap`);
    for (const h of sc.hazards) lines.push(`  ${HAZARD_NAMES[h.type]} ${h.dx >= 0 ? "+" : ""}${h.dx} ahead, y ${h.y}, swing ±${h.swing}`);
    return lines.join("\n");
  }

  const hud = document.getElementById("audit-hud");
  const hudStats = document.getElementById("audit-stats");
  const logBtn = document.getElementById("audit-log-btn");
  const speedBtn = document.getElementById("audit-speed");
  const logPanel = document.getElementById("audit-log");
  const logText = document.getElementById("audit-log-text");

  function updateHud() {
    hudStats.textContent = `AI AUDIT · RUN ${runs} · CRASHES ${crashes.length} · BEST ${auditBest} M`;
    logBtn.textContent = `Crash log (${crashes.length})`;
  }
  function renderLog() {
    logText.textContent = crashes.length ? crashes.map(crashText).join("\n\n") : "No crashes yet.";
  }
  function startAudit() {
    audit = true;
    hud.hidden = false;
    updateHud();
    reset();
  }
  function stopAudit() {
    audit = false;
    hud.hidden = true;
    logPanel.hidden = true;
    reset();
  }
  document.getElementById("audit-start").addEventListener("click", startAudit);
  document.getElementById("audit-stop").addEventListener("click", stopAudit);
  document.getElementById("audit-boxes").addEventListener("click", e => {
    showBoxes = !showBoxes;
    e.currentTarget.textContent = showBoxes ? "Hitboxes on" : "Hitboxes off";
  });
  speedBtn.addEventListener("click", () => {
    auditSpeed = auditSpeed === 1 ? 4 : 1;
    speedBtn.textContent = `Speed ${auditSpeed}×`;
  });
  logBtn.addEventListener("click", () => { renderLog(); logPanel.hidden = false; });
  document.getElementById("audit-close").addEventListener("click", () => { logPanel.hidden = true; });
  document.getElementById("audit-copy").addEventListener("click", e => {
    const btn = e.currentTarget;
    const all = crashes.map(crashText).join("\n\n") + "\n\n--- JSON ---\n" + JSON.stringify(crashes, null, 2);
    const done = () => { btn.textContent = "Copied"; setTimeout(() => (btn.textContent = "Copy"), 1500); };
    const fallback = () => {
      logText.textContent = all;
      const range = document.createRange();
      range.selectNodeContents(logText);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      btn.textContent = "Selected";
    };
    try { navigator.clipboard.writeText(all).then(done, fallback); } catch (err) { fallback(); }
  });

  /* ---------- Drawing ---------- */

  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#35b9d4");
    g.addColorStop(0.45, "#0f5f92");
    g.addColorStop(1, "#06294a");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sun rays from the surface
    ctx.save();
    ctx.globalAlpha = 0.09;
    ctx.fillStyle = "#e9fbff";
    for (let i = 0; i < 5; i++) {
      const x = ((i * 130 - time * 6) % (W + 200)) - 60 + Math.sin(time * 0.6 + i) * 15;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + 50, 0);
      ctx.lineTo(x + 170, H * 0.8);
      ctx.lineTo(x + 70, H * 0.8);
      ctx.fill();
    }
    ctx.restore();

    // Far reef silhouette, slow parallax
    ctx.fillStyle = "#0b3d63";
    const off = (time * 10) % 200;
    ctx.beginPath();
    ctx.moveTo(0, H - FLOOR);
    for (let x = -off; x <= W + 200; x += 200) {
      ctx.quadraticCurveTo(x + 50, H - FLOOR - 110, x + 100, H - FLOOR - 40);
      ctx.quadraticCurveTo(x + 150, H - FLOOR - 80, x + 200, H - FLOOR - 20);
    }
    ctx.lineTo(W, H - FLOOR);
    ctx.fill();

    // Distant fish school
    ctx.fillStyle = "rgba(10, 50, 85, 0.6)";
    const sx = W + 80 - ((time * 25) % (W + 200));
    const sy = H * 0.3 + Math.sin(time * 0.8) * 20;
    for (const f of school) {
      const fx = sx + f.dx, fy = sy + f.dy;
      ctx.beginPath();
      ctx.ellipse(fx, fy, 6, 2.5, 0, 0, Math.PI * 2);
      ctx.moveTo(fx + 5, fy);
      ctx.lineTo(fx + 10, fy - 3);
      ctx.lineTo(fx + 10, fy + 3);
      ctx.fill();
    }

    // Drifting specks
    ctx.fillStyle = "rgba(220, 245, 255, 0.35)";
    for (const m of motes) {
      const x = ((m.x * W - time * 8 * m.s) % W + W) % W;
      const y = ((m.y * H - time * 5) % H + H) % H;
      ctx.fillRect(x, y, m.s, m.s);
    }
  }

  function drawHazard(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    if (h.type === "jelly") {
      ctx.strokeStyle = "rgba(255, 170, 230, 0.8)";
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 5, 4);
        for (let t = 0; t <= 22; t += 4) ctx.lineTo(i * 5 + Math.sin(time * 5 + t * 0.4 + i) * 3, 4 + t);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255, 140, 220, 0.85)";
      ctx.beginPath();
      ctx.ellipse(0, 2, 17, 17 + Math.sin(time * 4 + h.phase) * 2, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.beginPath();
      ctx.ellipse(-5, -7, 4, 6, -0.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (h.type === "shark") {
      const tail = Math.sin(time * 8) * 5;
      ctx.fillStyle = "#7d8fa3";
      // Tail
      ctx.beginPath();
      ctx.moveTo(28, 0);
      ctx.lineTo(46, -12 + tail);
      ctx.lineTo(42, 0);
      ctx.lineTo(46, 12 + tail);
      ctx.closePath();
      ctx.fill();
      // Dorsal fin
      ctx.beginPath();
      ctx.moveTo(-4, -9);
      ctx.lineTo(8, -24);
      ctx.lineTo(12, -8);
      ctx.fill();
      // Body
      ctx.beginPath();
      ctx.ellipse(0, 0, 36, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e6eef5";
      ctx.beginPath();
      ctx.ellipse(-4, 5, 28, 6, 0, 0, Math.PI);
      ctx.fill();
      // Eye, gills, teeth
      ctx.fillStyle = "#0b1624";
      ctx.beginPath();
      ctx.arc(-24, -3, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#56677a";
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-12 + i * 4, -5);
        ctx.lineTo(-14 + i * 4, 3);
        ctx.stroke();
      }
      ctx.strokeStyle = "#ffffff";
      ctx.beginPath();
      ctx.moveTo(-34, 3);
      ctx.lineTo(-24, 5);
      ctx.stroke();
    } else if (h.type === "puffer") {
      const r = h.rx;
      ctx.strokeStyle = "#8a5a12";
      ctx.lineWidth = 2;
      for (let k = 0; k < 12; k++) {
        const a = (k * Math.PI) / 6;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.lineTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5));
        ctx.stroke();
      }
      ctx.fillStyle = "#ffcf4a";
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff4cf";
      ctx.beginPath();
      ctx.arc(0, r * 0.35, r * 0.65, 0, Math.PI);
      ctx.fill();
      ctx.fillStyle = "#0b1624";
      ctx.beginPath();
      ctx.arc(-r * 0.45, -r * 0.25, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e5733a";
      ctx.beginPath();
      ctx.moveTo(r - 2, 0);
      ctx.lineTo(r + 9, -7);
      ctx.lineTo(r + 9, 7);
      ctx.fill();
    } else if (h.type === "mine") {
      // Anchor cable down out of view
      ctx.strokeStyle = "rgba(30, 40, 50, 0.6)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 15);
      ctx.lineTo(0, 40);
      ctx.stroke();
      ctx.strokeStyle = "#2a323c";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      for (let k = 0; k < 8; k++) {
        const a = (k * Math.PI) / 4;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 12, Math.sin(a) * 12);
        ctx.lineTo(Math.cos(a) * 20, Math.sin(a) * 20);
        ctx.stroke();
      }
      ctx.fillStyle = "#3b4550";
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = Math.sin(time * 6 + h.phase) > 0 ? "#ff3b3b" : "#7a1d1d";
      ctx.beginPath();
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (h.type === "barrel") {
      ctx.rotate(h.rot);
      ctx.fillStyle = "#d8a21c";
      ctx.beginPath();
      ctx.roundRect(-13, -17, 26, 34, 5);
      ctx.fill();
      ctx.fillStyle = "#2a2a2a";
      ctx.fillRect(-13, -9, 26, 3);
      ctx.fillRect(-13, 6, 26, 3);
      // Hazard symbol
      ctx.fillStyle = "#2a2a2a";
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(6, 4);
      ctx.lineTo(-6, 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#7ddc4a";
      ctx.beginPath();
      ctx.arc(10, 15, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFloor() {
    const y = H - FLOOR;
    ctx.fillStyle = "#d9bf86";
    ctx.fillRect(0, y, W, FLOOR);
    ctx.fillStyle = "#c4a86c";
    ctx.fillRect(0, y, W, 6);
    for (let x = floorX; x < W + 48; x += 48) {
      // Sand ripples
      ctx.strokeStyle = "#bfa166";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y + 30);
      ctx.quadraticCurveTo(x + 12, y + 24, x + 24, y + 30);
      ctx.stroke();
      // Shell
      ctx.fillStyle = "#f6e1d3";
      ctx.beginPath();
      ctx.arc(x + 34, y + 52, 5, Math.PI, 0);
      ctx.fill();
      // Seaweed tuft
      ctx.strokeStyle = "#3f9d4f";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      const s = Math.sin(time * 2 + x * 0.05) * 3;
      ctx.beginPath();
      ctx.moveTo(x + 10, y + 2);
      ctx.lineTo(x + 6 + s, y - 12);
      ctx.moveTo(x + 14, y + 2);
      ctx.lineTo(x + 16 + s, y - 16);
      ctx.stroke();
    }
  }

  function drawDiver() {
    ctx.save();
    ctx.translate(diver.x, diver.y);
    ctx.rotate(diver.rot);
    const k = state === "over" ? 0 : Math.sin(time * 14) * 5;
    ctx.lineJoin = "round";
    // Fins
    ctx.fillStyle = "#ffcc33";
    ctx.beginPath();
    ctx.moveTo(-20, -2);
    ctx.lineTo(-36, -9 + k);
    ctx.lineTo(-34, -1 + k);
    ctx.closePath();
    ctx.moveTo(-20, 3);
    ctx.lineTo(-35, 2 - k);
    ctx.lineTo(-33, 10 - k);
    ctx.closePath();
    ctx.fill();
    // Legs
    ctx.fillStyle = "#1d2433";
    ctx.beginPath();
    ctx.roundRect(-22, -4, 18, 9, 4);
    ctx.fill();
    // Tank
    ctx.fillStyle = "#ff8a3d";
    ctx.beginPath();
    ctx.roundRect(-12, -15, 20, 8, 4);
    ctx.fill();
    ctx.fillStyle = "#9aa7b4";
    ctx.fillRect(8, -13, 4, 3);
    // Body
    ctx.fillStyle = "#1d2433";
    ctx.beginPath();
    ctx.ellipse(2, 0, 14, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#19b3a6";
    ctx.fillRect(-6, -1, 18, 3);
    // Arm reaching forward
    ctx.strokeStyle = "#1d2433";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(6, 4);
    ctx.lineTo(16, 9 + k * 0.3);
    ctx.stroke();
    // Head (hood)
    ctx.fillStyle = "#1d2433";
    ctx.beginPath();
    ctx.arc(18, -2, 7, 0, Math.PI * 2);
    ctx.fill();
    // Mask
    ctx.fillStyle = "#ff5d73";
    ctx.beginPath();
    ctx.roundRect(18, -7, 9, 7, 2);
    ctx.fill();
    ctx.fillStyle = "#9be7ff";
    ctx.beginPath();
    ctx.roundRect(19.5, -5.5, 6, 4, 1.5);
    ctx.fill();
    // Regulator
    ctx.fillStyle = "#9aa7b4";
    ctx.beginPath();
    ctx.arc(24, 3, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBubbles() {
    ctx.strokeStyle = "rgba(220, 248, 255, 0.85)";
    ctx.fillStyle = "rgba(220, 248, 255, 0.15)";
    ctx.lineWidth = 1.2;
    for (const b of bubbles) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  function text(str, x, y, size) {
    ctx.font = `${size}px Bungee, "Arial Black", Impact, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = size / 5;
    ctx.strokeStyle = "#062a4a";
    ctx.strokeText(str, x, y);
    ctx.fillStyle = "#f4fbff";
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawWater();
    for (const g of cols) {
      ctx.save(); ctx.translate(g.x + g.tox, 0); g.tp.draw(); ctx.restore();
      ctx.save(); ctx.translate(g.x + g.box, 0); g.bp.draw(); ctx.restore();
    }
    drawFloor();
    for (const h of hazards) drawHazard(h);
    if (audit && showBoxes) {
      for (const g of cols) { drawPrims(g.tp.prims, g.x + g.tox); drawPrims(g.bp.prims, g.x + g.box); }
      drawPrims(hazards.map(h => E(h.x, h.y, h.rx, h.ry)), 0);
      drawPrims([C(diver.x + 2, diver.y, DIVER_R - 3)], 0);
    }
    drawBubbles();
    if (audit && state === "play" && aiPath.length) {
      ctx.fillStyle = lastPlan && lastPlan.ok ? "rgba(155, 231, 255, 0.8)" : "rgba(255, 93, 115, 0.9)";
      for (const pt of aiPath) {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    drawDiver();

    const cx = W / 2;
    if (state === "ready" && audit) {
      text("AI AUDIT", cx, H * 0.22, 36);
    } else if (state === "ready") {
      text("FLAPPY", cx, H * 0.18, 48);
      text("DIVER", cx, H * 0.27, 48);
      text(mode === "positive" ? "Tap to swim down" : "Tap to swim up", cx, H * 0.58, 22);
      text("Dodge reefs, wrecks", cx, H * 0.64, 14);
      text("and sea creatures", cx, H * 0.675, 14);
      if (best) text(`Best ${best} m`, cx, H * 0.72, 16);
    } else {
      text(`${score} m`, cx, 70, 46);
      const since = time - calmT;
      if (since < 2.2 && state === "play") {
        ctx.globalAlpha = Math.min(1, (2.2 - since) / 0.6);
        text("CALM WATERS", cx, 130, 22);
        ctx.globalAlpha = 1;
      }
    }
    if (state === "over") {
      const since = time - overT;
      if (since < 0.12) {
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillRect(0, 0, W, H);
      }
      ctx.fillStyle = "rgba(6, 42, 74, 0.6)";
      ctx.beginPath();
      ctx.roundRect(cx - 130, H * 0.3, 260, 190, 16);
      ctx.fill();
      text("GAME OVER", cx, H * 0.36, 32);
      text(`Distance ${score} m`, cx, H * 0.45, 20);
      if (audit) {
        text("Hit:", cx, H * 0.51, 16);
        text(causeName(lastCause), cx, H * 0.55, causeName(lastCause).length > 18 ? 11 : 15);
      } else {
        text(`Best ${best} m`, cx, H * 0.51, 22);
        if (since > 0.6) text("Tap to retry", cx, H * 0.58, 18);
      }
    }
  }

  // Fixed-step loop: the game always advances in STEP-sized ticks
  let lastT = performance.now(), acc = 0;
  time = 0;
  function loop(now) {
    acc += Math.min(0.1, (now - lastT) / 1000) * (audit ? auditSpeed : 1);
    lastT = now;
    let n = 0;
    while (acc >= STEP && n < 30) {
      if (audit) aiThink();
      time += STEP;
      update(STEP);
      stepCount++;
      acc -= STEP;
      n++;
    }
    if (n === 30) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", e => { e.preventDefault(); if (audit) return; canvas.focus(); kick(); });
  window.addEventListener("keydown", e => {
    if (audit) { if (e.code === "Escape") stopAudit(); return; }
    if (e.target.closest && e.target.closest("button")) return; // let the buoyancy buttons handle their own keys
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" || e.code === "Enter") { e.preventDefault(); kick(); }
    if (e.code === "KeyB" && state === "ready") setMode(mode === "positive" ? "negative" : "positive");
  });
  window.addEventListener("resize", () => { resize(); if (state === "ready") reset(); });

  window.flappyAudit = { start: startAudit, crashes, stats: () => ({ runs, auditBest, crashes: crashes.length }), setSpeed: v => (auditSpeed = v) };

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
